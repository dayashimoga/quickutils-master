version: '3.8'

services:
  test-runner:
    build: 
      context: .
      dockerfile: Dockerfile.test
    container_name: quickutils_test_runner
    environment:
      - NODE_OPTIONS=--max-old-space-size=8192
    command: >
      sh -c "echo '=== Python Tests ===' && 
             python3 -m pytest tests/test_smoke_all.py tests/test_coverage_booster.py --cov=scripts --cov-report=term --cov-report=xml --cov-fail-under=90 && 
             echo '=== Node.js Tests ===' && 
             npx vitest run --coverage"
