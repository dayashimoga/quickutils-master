name: Assign Custom Domains
on:
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM UTC
  workflow_dispatch:
    inputs:
      batch_size:
        description: 'Number of domains to process per batch'
        default: '10'
      delay:
        description: 'Base delay between API calls (seconds)'
        default: '5'
      dry_run:
        description: 'Dry run mode (no actual changes)'
        type: boolean
        default: false

jobs:
  assign-domains:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Domain Assignment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python scripts/assign_domains_bulk.py \
            --batch-size ${{ github.event.inputs.batch_size || '10' }} \
            --delay ${{ github.event.inputs.delay || '5' }} \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }} \
            --report-json domain_report.json

      - name: Upload Domain Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: domain-assignment-report
          path: domain_report.json
          retention-days: 30
