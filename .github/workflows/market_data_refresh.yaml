name: Market Data Refresh

on:
  schedule:
    - cron: '0 0 * * *' # Run daily at midnight UTC
  workflow_dispatch: # Allow manual triggers

permissions:
  contents: write

jobs:
  refresh-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f projects/market-digest/requirements.txt ]; then pip install -r projects/market-digest/requirements.txt; fi

      - name: Fetch Latest Market Data
        working-directory: projects/market-digest
        run: |
          python fetch_data.py

      - name: Commit and Push Data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add projects/market-digest/data.json
          git diff --quiet && git diff --staged --quiet && exit 0
          git commit -m "chore: Daily market data refresh"
          # Retry push up to 3 times with rebase to handle race conditions
          for i in 1 2 3; do
            git pull --rebase origin main && git push && break
            echo "Push attempt $i failed, retrying in 5s..."
            sleep 5
          done

      - name: Trigger Network Provisioning
        # Optionally trigger the main deployment workflow if you want immediate deployment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_PAT }}
          script: |
            github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'provision_network.yaml',
              ref: 'main'
            })
