name: QuickUtils Network Orchestrator

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '*.md'
      - '.gitignore'
      - 'tests/**'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      trigger_all:
        description: 'Trigger deployment for ALL projects (yes/no)'
        required: false
        default: 'no'

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Job 1: Detect what changed ───
  detect:
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.changes.outputs.projects }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Detect Changed Projects
        id: changes
        run: |
          if [ "${{ github.event.inputs.trigger_all }}" = "yes" ]; then
            CHANGED="ALL"
            echo "Manual trigger: deploying ALL projects"
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              DIFF_TARGET="HEAD~1 HEAD"
            else
              DIFF_TARGET="$BEFORE ${{ github.sha }}"
            fi
            CHANGED=$(git diff --name-only $DIFF_TARGET 2>/dev/null | grep '^projects/\|^terraform/\|^shared/' | cut -d/ -f2 | sort -u | tr '\n' ',' | sed 's/,$//')
            
            # Also detect shared/config/scripts changes that affect all projects
            SHARED_CHANGED=$(git diff --name-only $DIFF_TARGET 2>/dev/null | grep -c '^shared/\|^terraform/projects.json\|^scripts/redeploy\|^scripts/cancel\|^scripts/assign_domains' || true)
            if [ "$SHARED_CHANGED" -gt "0" ]; then
              CHANGED="ALL"
              echo "Infrastructure files changed — deploying ALL projects"
            fi
            
            if [ -z "$CHANGED" ]; then
              CHANGED="NONE"
              echo "No project changes detected — skipping deployment"
            else
              echo "Changed projects: $CHANGED"
            fi
          fi
          echo "projects=$CHANGED" >> $GITHUB_OUTPUT

  # ─── Job 2: Deploy via Wrangler (depends on detect) ───
  deploy:
    needs: detect
    if: needs.detect.outputs.projects != 'NONE'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install requests

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Sync GitHub Repositories
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          OWNER: "dayashimoga"
          PYTHONPATH: "."
          CHANGED_PROJECTS: ${{ needs.detect.outputs.projects }}
        run: |
          python scripts/sync_project_scripts.py
          python scripts/generate_projects_json.py 2>/dev/null || true
          
          git config --global user.email "bot@quickutils.top"
          git config --global user.name "QuickUtils Bot"
          
          echo "Syncing projects: $CHANGED_PROJECTS"
          python scripts/github_distribute.py

      - name: Cleanup Orphans & Deploy via Wrangler
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CHANGED_PROJECTS: ${{ needs.detect.outputs.projects }}
          PYTHONPATH: "."
        run: |
          # 1. Free CF 100-limit slots by deleting orphaned projects FIRST
          echo "=== Deleting orphaned Cloudflare projects ==="
          python scripts/cf_cleanup_orphans.py
          
          # 2. Extinguish stale projects
          python scripts/cf_extinguisher.py
          
          # 3. Cancel old builds synchronously before deploying new ones
          python scripts/cancel_cf_builds.py
          
          # 4. Deploy changed projects (parallel, 8 at a time)
          python scripts/redeploy_cloudflare.py

  # ─── Job 3: Assign Custom Domains (runs AFTER deploy completes) ───
  domains:
    needs: [detect, deploy]
    if: needs.detect.outputs.projects != 'NONE'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install requests

      - name: Assign Custom Domains
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PYTHONPATH: "."
        run: |
          echo "=== Assigning custom domains (after deploy) ==="
          python scripts/assign_domains_bulk.py

  # ─── Job 4: Skip message ───
  skip:
    needs: detect
    if: needs.detect.outputs.projects == 'NONE'
    runs-on: ubuntu-latest
    steps:
      - run: echo "✅ No project changes detected. Skipping deployment."
