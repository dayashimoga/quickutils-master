name: QuickUtils Network Orchestrator

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '*.md'
      - '.gitignore'
      - 'tests/**'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      trigger_all:
        description: 'Trigger deployment for ALL projects (yes/no)'
        required: false
        default: 'no'

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install requests

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Detect Changed Projects
        id: changes
        run: |
          if [ "${{ github.event.inputs.trigger_all }}" = "yes" ]; then
            CHANGED="ALL"
            echo "Manual trigger: deploying ALL projects"
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              DIFF_TARGET="HEAD~1 HEAD"
            else
              DIFF_TARGET="$BEFORE ${{ github.sha }}"
            fi
            CHANGED=$(git diff --name-only $DIFF_TARGET 2>/dev/null | grep '^projects/\|^terraform/\|^shared/' | cut -d/ -f2 | sort -u | tr '\n' ',' | sed 's/,$//')
            
            # Also detect shared/config/scripts changes that affect all projects
            SHARED_CHANGED=$(git diff --name-only $DIFF_TARGET 2>/dev/null | grep -c '^shared/\|^terraform/projects.json\|^scripts/redeploy\|^scripts/cancel' || true)
            if [ "$SHARED_CHANGED" -gt "0" ]; then
              CHANGED="ALL"
              echo "Infrastructure files changed — deploying ALL projects"
            fi
            
            if [ -z "$CHANGED" ]; then
              CHANGED="NONE"
              echo "No project changes detected — skipping deployment"
            else
              echo "Changed projects: $CHANGED"
            fi
          fi
          echo "projects=$CHANGED" >> $GITHUB_OUTPUT

      - name: Sync GitHub Repositories
        if: steps.changes.outputs.projects != 'NONE'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          OWNER: "dayashimoga"
          PYTHONPATH: "."
          CHANGED_PROJECTS: ${{ steps.changes.outputs.projects }}
        run: |
          python scripts/sync_project_scripts.py
          python scripts/generate_projects_json.py 2>/dev/null || true
          
          git config --global user.email "bot@quickutils.top"
          git config --global user.name "QuickUtils Bot"
          
          echo "Syncing projects: $CHANGED_PROJECTS"
          python scripts/github_distribute.py

      - name: Cancel Queued CF Builds & Deploy via Wrangler
        if: steps.changes.outputs.projects != 'NONE'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CHANGED_PROJECTS: ${{ steps.changes.outputs.projects }}
        run: |
          # Free CF 100-limit slots by extinguishing orphaned projects first
          python scripts/cf_extinguisher.py
          
          # Cancel old builds synchronously before deploying new ones
          python scripts/cancel_cf_builds.py
          
          # Deploy changed projects immediately (parallel, 4 at a time)
          python scripts/redeploy_cloudflare.py
          
          # Assign custom domains automatically 
          python scripts/assign_domains_bulk.py
          
      - name: Provision DNS CNAME Records
        if: steps.changes.outputs.projects != 'NONE'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python -c "
          import json, os, time, urllib.request, urllib.error

          token = os.environ['CLOUDFLARE_API_TOKEN']
          headers = {'Authorization': f'Bearer {token}', 'Content-Type': 'application/json'}

          def api(method, url, payload=None):
              data = json.dumps(payload).encode() if payload else None
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req) as r:
                      return json.loads(r.read()), r.status
              except urllib.error.HTTPError as e:
                  body = e.read().decode() if hasattr(e, 'read') else ''
                  return {'error': body}, e.code
              except Exception:
                  return None, 500

          # Get zone
          zr, _ = api('GET', 'https://api.cloudflare.com/client/v4/zones?name=quickutils.top')
          if not (zr and zr.get('success') and zr.get('result')):
              print('Could not fetch zone'); exit(0)
          zone_id = zr['result'][0]['id']
          print(f'Zone: {zone_id}')

          with open('project_config.json') as f:
              cfg = json.load(f)

          created = updated = skipped = 0
          for folder, proj in cfg.get('projects', {}).items():
              url = proj.get('SITE_URL', '')
              if 'quickutils.top' not in url: continue
              domain = url.replace('https://','').replace('http://','').strip('/').split('/')[0]
              target = f'{folder}.pages.dev'

              dr, _ = api('GET', f'https://api.cloudflare.com/client/v4/zones/{zone_id}/dns_records?name={domain}&type=CNAME')
              records = dr.get('result', []) if dr else []

              payload = {'type':'CNAME','name':domain,'content':target,'proxied':True,'comment':'Auto-provisioned'}

              if records:
                  r = records[0]
                  if r.get('proxied') and r.get('content') == target:
                      skipped += 1; continue
                  pr, pc = api('PUT', f'https://api.cloudflare.com/client/v4/zones/{zone_id}/dns_records/{r[\"id\"]}', payload)
                  if pc in [200,201]: updated += 1; print(f'  [UPDATED] {domain}')
                  else: print(f'  [ERROR] {domain} HTTP {pc}')
              else:
                  pr, pc = api('POST', f'https://api.cloudflare.com/client/v4/zones/{zone_id}/dns_records', payload)
                  if pc in [200,201]: created += 1; print(f'  [CREATED] {domain}')
                  else: print(f'  [ERROR] {domain} HTTP {pc}')
              time.sleep(0.3)

          print(f'DNS Done: {created} created, {updated} updated, {skipped} already ok')
          "

      - name: Skip - No Changes
        if: steps.changes.outputs.projects == 'NONE'
        run: echo "✅ No project changes detected. Skipping deployment."

