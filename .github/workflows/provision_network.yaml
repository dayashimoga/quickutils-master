name: QuickUtils Network Orchestrator

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '*.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      trigger_all:
        description: 'Trigger deployment for ALL projects (yes/no)'
        required: false
        default: 'no'

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install requests

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Detect Changed Projects
        id: changes
        run: |
          # If trigger_all is set to 'yes', deploy everything
          if [ "${{ github.event.inputs.trigger_all }}" = "yes" ]; then
            CHANGED="ALL"
            echo "Manual trigger: deploying ALL projects"
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              DIFF_TARGET="HEAD~1 HEAD"
            else
              DIFF_TARGET="$BEFORE ${{ github.sha }}"
            fi
            CHANGED=$(git diff --name-only $DIFF_TARGET 2>/dev/null | grep '^projects/' | cut -d/ -f2 | sort -u | tr '\n' ',' | sed 's/,$//')
            if [ -z "$CHANGED" ]; then
              CHANGED="NONE"
              echo "No specific project changes detected — skipping project syncs"
            else
              echo "Changed projects: $CHANGED"
            fi
          fi
          echo "projects=$CHANGED" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Repositories & Sync Code
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          OWNER: "dayashimoga"
          PYTHONPATH: "."
          CHANGED_PROJECTS: ${{ steps.changes.outputs.projects }}
        run: |
          python scripts/sync_project_scripts.py
          python scripts/generate_projects_json.py
          
          git config --global user.email "bot@quickutils.top"
          git config --global user.name "QuickUtils Bot"
          
          echo "Syncing projects: $CHANGED_PROJECTS"
          python scripts/github_distribute.py

      - name: Direct Build & Deploy via Wrangler
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CHANGED_PROJECTS: ${{ steps.changes.outputs.projects }}
        run: |
          python scripts/redeploy_cloudflare.py
