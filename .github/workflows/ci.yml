name: CI & Operations

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Run Python Tests
        run: |
          pytest --cov=scripts --cov-report=xml --cov-report=term tests/
          COVERAGE=$(python -c "import xml.etree.ElementTree as ET; tree = ET.parse('coverage.xml'); root = tree.getroot(); print(root.attrib['line-rate'])")
          echo "Core scripts coverage: $COVERAGE"
          python -c "import sys; c=float('$COVERAGE'); print(f'Coverage: {c*100:.1f}%'); sys.exit(0 if c >= 0.90 else 1)"

      - name: Run Vitest (All Projects)
        run: npx vitest run --coverage --coverage.thresholds.lines=90
        env:
          NODE_ENV: test

      - name: Upload Coverage Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage/
            coverage.xml
          retention-days: 14
