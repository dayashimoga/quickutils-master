<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keyboard Tester | QuickUtils</title>
    <meta name="keywords" content="QuickUtils, keyboard, tester, code, design, productivity, online tools">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://quickutils.top/keyboard-tester/">
    <meta property="og:title" content="Keyboard Tester | QuickUtils">
    <meta property="og:description" content="Test every key on your keyboard with a visual heatmap, response time tracking, and ghosting detection.">
    <meta property="og:url" content="https://quickutils.top/keyboard-tester/">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="description" content="Test every key on your keyboard with a visual heatmap, response time tracking, and ghosting detection.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⌨️</text></svg>">
    <link rel="stylesheet" href="quickutils-core.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="grid-bg">
    <nav class="navbar glass-nav"><div class="container nav-inner">
        <a href="https://quickutils.top" class="brand holo-text">⌨️ Keyboard Tester</a>
        <div class="nav-links">
            <a href="https://ko-fi.com/dayatin" target="_blank" class="kofi-link">☕ Support</a>
            <button id="themeBtn" class="theme-btn">🌙</button>
        </div>
    </div></nav>
    <main class="container py-4">
        <div class="hero-section text-center mb-4"><h1 class="gradient-text">Keyboard Tester</h1><p class="text-muted">Press any key to test — see response times and a visual heatmap</p></div>
    <div class="glass-card p-4 text-center">
        <div id="lastKey" style="font-size:4rem;font-weight:800;padding:2rem;color:var(--clr-primary,#6366f1);">Press any key</div>
        <div class="d-flex justify-content-center gap-4 mt-2"><span>Keys Pressed: <strong id="keyCount">0</strong></span><span>Avg Response: <strong id="avgTime">0</strong>ms</span></div>
    </div>
    <div class="glass-card p-4 mt-4"><h3>Key Heatmap</h3><div id="heatmap" style="display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:1rem;"></div></div>
    <div class="glass-card p-4 mt-4"><h3>Press Log</h3><div id="keyLog" style="max-height:200px;overflow-y:auto;font-family:monospace;font-size:0.85rem;"></div></div>
    </main>
    <footer class="footer"><div class="container copyright text-center py-4">© 2026 QuickUtils. All rights reserved.</div></footer>
    <script src="quickutils-core.js"></script>
    <script src="script.js"></script>
</body>
</html>
