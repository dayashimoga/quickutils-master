<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="keywords" content="QuickUtils, ai, prompt, builder, code, design, productivity, online tools">

    <link rel="canonical" href="https://quickutils.top/ai-prompt-builder/">
    <meta property="og:title" content="AI Prompt Builder | QuickUtils">
    <meta property="og:description" content="Build perfect AI prompts for ChatGPT, Midjourney, Stable Diffusion with structured templates and one-click copy.">
    <meta property="og:url" content="https://quickutils.top/ai-prompt-builder/">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="description" content="Build perfect AI prompts for ChatGPT, Midjourney, Stable Diffusion with structured templates and one-click copy.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
    <link rel="stylesheet" href="quickutils-core.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="grid-bg">
    <nav class="navbar glass-nav"><div class="container nav-inner">
        <a href="https://quickutils.top" class="brand holo-text">🤖 AI Prompt Builder</a>
        <div class="nav-links">
            <a href="https://ko-fi.com/dayatin" target="_blank" class="kofi-link">☕ Support</a>
            <button id="themeBtn" class="theme-btn">🌙</button>
        </div>
    </div></nav>
    <main class="container py-4">
        <div class="hero-section text-center mb-4"><h1 class="gradient-text">AI Prompt Builder</h1><p class="text-muted">Craft perfect prompts for any AI model</p></div>
    <div class="glass-card p-4 mb-4">
        <div class="d-flex gap-2 mb-3" style="flex-wrap:wrap;">
            <button class="btn btn-primary model-btn active" data-model="chatgpt">ChatGPT</button>
            <button class="btn btn-secondary model-btn" data-model="midjourney">Midjourney</button>
            <button class="btn btn-secondary model-btn" data-model="dalle">DALL·E</button>
            <button class="btn btn-secondary model-btn" data-model="code">Code Assistant</button>
        </div>
        <div id="builderArea"></div>
        <textarea id="promptOutput" class="form-control mt-3" rows="6" placeholder="Your generated prompt will appear here..." readonly></textarea>
        <div class="d-flex gap-2 mt-3"><button class="btn btn-primary" id="copyBtn">📋 Copy Prompt</button><button class="btn btn-secondary" id="clearBtn">Clear</button></div>
    </div>
    <div class="glass-card p-4"><h3>📚 Prompt History</h3><div id="historyList" class="mt-3"></div></div>
    </main>
    <footer class="footer"><div class="container copyright text-center py-4">© 2026 QuickUtils. All rights reserved.</div></footer>
    <script src="quickutils-core.js"></script>
    <script src="script.js"></script>
</body>
