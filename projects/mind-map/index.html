<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Mind Map — Visual Mind Mapping Tool | QuickUtils</title>
    <script type="application/ld+json">
{
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Mind Map \u2014 Visual Mind Mapping Tool",
    "url": "https://mindmap.quickutils.top/",
    "description": "Create beautiful mind maps visually. Add nodes, connect ideas, customize colors. Export as PNG, SVG, or JSON. Free online mind mapping tool.",
    "applicationCategory": "BrowserApplication",
    "operatingSystem": "All",
    "offers": {
        "@type": "Offer",
        "price": "0.00",
        "priceCurrency": "USD"
    }
}
</script>
    <link rel="canonical" href="https://mindmap.quickutils.top/">
    <meta name="keywords" content="QuickUtils, mind, map, code, design, productivity, online tools">
    <meta name="robots" content="index, follow">
    
    <meta property="og:title" content="Mind Map — Visual Mind Mapping Tool | QuickUtils">
    <meta property="og:description" content="Create beautiful mind maps visually. Add nodes, connect ideas, customize colors. Export as PNG, SVG, or JSON. Free online mind mapping tool.">
    <meta property="og:url" content="https://quickutils.top/mind-map/">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="description" content="Create beautiful mind maps visually. Add nodes, connect ideas, customize colors. Export as PNG, SVG, or JSON. Free online mind mapping tool.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>">
    <link rel="stylesheet" href="quickutils-core.css">
    <link rel="stylesheet" href="style.css">
    <meta name="theme-color" content="#ffffff">
</head>
<body>
    <nav class="navbar"><div class="container nav-inner">
        <a href="https://quickutils.top" class="brand">🧠 Mind Map</a>
        <div class="nav-links">
            <button class="btn btn-sm btn-primary" id="addNodeBtn" title="Tab">➕ Add Node</button>
            <button class="btn btn-sm btn-secondary" id="deleteNodeBtn" title="Delete">🗑️</button>
            <button class="btn btn-sm btn-secondary" onclick="undo()" title="Ctrl+Z">↩️</button>
            <button class="btn btn-sm btn-secondary" onclick="redo()" title="Ctrl+Y">↪️</button>
            <button class="btn btn-sm btn-secondary" onclick="autoLayout()" title="Ctrl+A">✨ Auto Layout</button>
            <select class="btn btn-sm btn-secondary" style="background:var(--bg-surface);color:var(--text);border:1px solid var(--border);" onchange="if(this.value){loadTemplate(this.value);this.value='';}">
                <option value="">📂 Load Template...</option>
                <option value="project">📋 Project Planning</option>
                <option value="swot">📊 SWOT Analysis</option>
                <option value="brainstorm">💡 Brainstorm</option>
                <option value="meeting">📝 Meeting Notes</option>
                <option value="learning">🎓 Learning Path</option>
            </select>
            <div class="dropdown-wrapper" style="display:inline-block;position:relative;">
                <button class="btn btn-sm btn-secondary" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='block'?'none':'block'">💾 Export ▾</button>
                <div style="display:none;position:absolute;top:100%;right:0;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;padding:0.5rem;z-index:1000;box-shadow:0 10px 30px rgba(0,0,0,0.3);min-width:120px;">
                    <button class="btn btn-sm btn-secondary" id="exportPngBtn" style="width:100%;margin-bottom:0.3rem;text-align:left;">🖼️ PNG</button>
                    <button class="btn btn-sm btn-secondary" onclick="exportSVG()" style="width:100%;margin-bottom:0.3rem;text-align:left;">📐 SVG</button>
                    <button class="btn btn-sm btn-secondary" id="exportJsonBtn" style="width:100%;text-align:left;">💾 JSON</button>
                </div>
            </div>
            <button class="btn btn-sm btn-secondary" id="importJsonBtn">📂 Import</button>
            <button class="btn btn-sm btn-secondary" id="clearBtn">🧹</button>
            <a href="https://ko-fi.com/dayatin" target="_blank" class="kofi-link">☕</a>
            <button id="themeBtn" class="theme-btn">🌙</button>
        </div>
    </div></nav>
    <main class="map-container" id="mapContainer">
        <canvas id="mapCanvas"></canvas>
        <div id="nodeLayer"></div>
        <div class="zoom-controls">
            <button id="zoomInBtn">+</button>
            <span id="zoomLevel">100%</span>
            <button id="zoomOutBtn">−</button>
            <button id="fitBtn">⊡</button>
        </div>
        <div class="node-editor glass-card" id="nodeEditor" style="display:none">
            <h3>Edit Node</h3>
            <input type="text" id="nodeText" placeholder="Node text">
            <div class="color-row" id="colorPicker"></div>
            <button class="btn btn-sm btn-primary" id="applyNodeBtn" style="width:100%">Apply</button>
        </div>
    </main>
    <input type="file" id="importFile" accept=".json" style="display:none">
    <footer class="footer"><div class="container copyright">© 2026 QuickUtils. All rights reserved.</div></footer>
    <script src="quickutils-core.js"></script>
    <script src="script.js"></script>

</body>
</html>
